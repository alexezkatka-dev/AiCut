# Edit style for long-form food videos (16:9, male TTS voiceover, hands-only POV).

zoom_by_role:
  hook:    {from: 1.00, to: 1.12}
  problem: {from: 1.00, to: 1.06}
  step:    {from: 1.00, to: 1.06}
  result:  {from: 1.00, to: 1.08}
  cta:     {from: 1.00, to: 1.00}
  broll:   {from: 1.00, to: 1.04}

text_styles:
  bold:
    color: "#FFFFFF"
    stroke_color: "#000000"
    stroke_width: 0.08
    size: 9
    position_y: -0.55      # lower third
  accent:
    color: "#FFD400"
    stroke_color: "#000000"
    stroke_width: 0.08
    size: 9
    position_y: -0.55

music:
  volume: 0.12
  duck_under_voice: false  # stage 6

subtitles:
  enabled: false
  max_chars_per_line: 32

pacing:
  min_shot_sec: 1.2
  max_shot_sec: 6.0        # longer slots are split into two takes of the same shot
